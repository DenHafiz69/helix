theme = "catppuccin_frappe"

[editor]
auto-format = true
line-number = "relative"
mouse = false
color-modes = true
bufferline = "multiple"
auto-pairs = true

[editor.soft-wrap]
enable = false

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

